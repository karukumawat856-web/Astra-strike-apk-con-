:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:#000;color:var(--text);font-family:"Trebuchet MS","Noto Sans Devanagari",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);background:#02020a;display:flex;align-items:center;justify-content:center}
#cv{display:block;touch-action:none;background:#02020a}
.screen{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;padding:12px 14px 22px;background:radial-gradient(ellipse at 50% -10%,#2a1f7a 0%,#0c0f3a 42%,#03030c 100%)}
.screen.clear{background:rgba(3,3,12,.82)}
.hide{display:none!important}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:980px;margin:0 auto 4px}
.coin{font-weight:800;color:#ffd34d;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:16px}
.ico{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:19px;cursor:pointer}
.logo{font-family:Impact,"Trebuchet MS",system-ui,sans-serif;font-weight:800;text-align:center;margin:0;font-size:clamp(26px,5.5vw,48px);letter-spacing:.09em;text-shadow:0 0 .35em var(--cyan),0 0 1em var(--pink)}
.sub{text-align:center;color:var(--muted);margin:2px 0 8px;font-size:14px}
.hero{display:flex;gap:14px;align-items:center;justify-content:center;max-width:980px;margin:6px auto;flex-wrap:wrap}
.hero canvas{width:min(260px,44vw);height:min(260px,44vw);border-radius:20px;background:radial-gradient(circle,#2e2a8a 0%,#0a0c30 70%);border:1px solid var(--line)}
.hinfo{min-width:200px;max-width:380px}
.pn{font-family:Impact,"Trebuchet MS",system-ui,sans-serif;font-size:24px;font-weight:800;letter-spacing:.06em}
.role{color:var(--cyan);font-weight:700;margin-bottom:6px}
.abl{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.3;color:var(--muted);margin:6px 0}
.abl b{color:var(--amber);font-family:Impact,"Trebuchet MS",system-ui,sans-serif;font-size:12px;letter-spacing:.05em;display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.row.c{justify-content:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;max-width:980px;margin:8px auto}
.card{position:relative;text-align:left;border:1px solid var(--line);border-left:5px solid var(--a,#fff);border-radius:16px;padding:10px 14px;background:linear-gradient(160deg,var(--panel2),var(--panel));cursor:pointer;color:inherit;font:inherit;min-height:92px}
.card:active{transform:scale(.98)}
.card .ic{font-size:24px}.card h3{margin:0;font-family:Impact,"Trebuchet MS",system-ui,sans-serif;font-size:13.5px;letter-spacing:.05em}.card p{margin:2px 0 0;color:var(--muted);font-size:12.5px;line-height:1.25}
.card .best{position:absolute;right:10px;top:8px;font-size:11px;font-weight:800;color:var(--amber)}
.btn{border:0;border-radius:14px;padding:10px 20px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:#12100a;background:linear-gradient(90deg,var(--amber),#ffd36b);box-shadow:0 0 16px rgba(255,176,32,.3)}
.btn.alt{background:var(--panel2);color:var(--text);box-shadow:none;border:1px solid var(--line)}

.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.97)}
.box{max-width:720px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.box h2{margin:0 0 4px;font-family:Impact,"Trebuchet MS",system-ui,sans-serif;font-size:19px;letter-spacing:.05em}
.box p{color:var(--muted);margin:4px 0 8px;font-size:14px;line-height:1.35}
.pcs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;max-width:980px;margin:0 auto;touch-action:pan-x}
.pc{flex:none;width:112px;border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--panel);cursor:pointer;text-align:center;color:inherit;font:inherit}
.pc.on{border-color:var(--cyan);box-shadow:0 0 14px rgba(75,227,255,.5)}
.pc canvas{width:84px;height:84px}
.pc b{display:block;font-family:Impact,"Trebuchet MS",system-ui,sans-serif;font-size:11px;letter-spacing:.05em}
.pc small{color:var(--amber);font-weight:800}
.stat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:3px 0}
.stat span:first-child{width:92px;font-weight:700}
.sb{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.sb i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:#fff;box-shadow:0 0 10px #fff}
.upg{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin:8px 0;background:var(--panel2)}
.upg .t{flex:1}.upg .t b{font-size:15px}.upg .t small{display:block;color:var(--muted);font-size:12px}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{width:12px;height:6px;border-radius:2px;background:rgba(255,255,255,.15)}.pips i.on{background:var(--cyan)}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;max-width:760px;margin:8px auto}
.sec{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel2);text-align:center;cursor:pointer;color:inherit;font:inherit}

.sec.lock{opacity:.4}
.seg{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 13px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.seg.on{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.lbl{width:100%;font-size:13px;color:var(--muted);font-weight:700;margin-top:6px}
.rs{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0;font-size:15px}
.big{font-family:Impact,"Trebuchet MS",system-ui,sans-serif;font-size:28px;font-weight:800;margin:2px 0}
.fl{position:absolute;z-index:5;border:1px solid rgba(255,255,255,.3);background:rgba(8,10,34,.7);color:#fff;border-radius:12px;font-weight:800;cursor:pointer;font-family:inherit;width:42px;height:38px;font-size:16px;padding:0}
#pauseBtn{top:10px;right:10px}
#loading{position:absolute;inset:0;z-index:20;background:#03030c;display:flex;align-items:center;justify-content:center;font-family:Impact,"Trebuchet MS",system-ui,sans-serif;letter-spacing:.1em;color:var(--cyan)}

/* Multiplayer hub */
.mp-wrap{max-width:980px;margin:10px auto;background:linear-gradient(145deg,rgba(20,28,78,.96),rgba(8,10,34,.96));border:1px solid #3c4caa;border-radius:18px;padding:14px;box-shadow:0 0 22px rgba(75,227,255,.08)}

.mp-id{border:1px dashed #4be3ff;border-radius:12px;padding:10px;margin:10px 0;background:rgba(75,227,255,.06);overflow-wrap:anywhere}
.mp-input{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:#080b27;color:var(--text);padding:12px;font:inherit;outline:none}.mp-input:focus{border-color:var(--cyan)}

var WORLDN=['Nebula Gate','Crimson Belt','Frozen Rift','Toxic Reach','Solar Forge','Void Abyss','Neon Grid','Omega Core','Dead Moon','Final Frontier'];
var LMODS=['hell','fast','double','meteors','ghost','fog','grid','volatile','shield','elite','timeslow','gravity','wind'];
function levelDef(n){
 var w=Math.floor((n-1)/10),i=(n-1)%10,lv=Math.min(25,1+Math.floor(n*.31)),cfg={lv:lv,theme:w%8,ramp:40},nm='',ic='⭐',goal,mods=[],pool=null,diff=Math.min(5,1+Math.floor(n/17));
 switch(i){
  case 0:goal={t:'kills',n:Math.min(120,25+Math.floor(n*.9))};nm='Clear Out';ic='🎯';break;
  case 1:goal={t:'time',n:Math.min(100,45+Math.floor(n*.5))};nm='Hold the Line';ic='🛡️';break;
  case 2:goal={t:'score',n:3000+n*260};cfg.limit=100+Math.min(60,n);nm='Score Run';ic='🏁';break;
  case 3:goal={t:'coins',n:60+n*3};cfg.limit=100;mods.push('coinrush');nm='Coin Sweep';ic='🪙';break;
  case 4:goal={t:'elites',n:Math.min(14,4+Math.floor(n/10))};mods.push('elite');pool=['fighter','gunship','bomber'];nm='Elite Squad';ic='👑';break;
  case 5:goal={t:'time',n:Math.min(100,45+Math.floor(n*.5))};mods.push(LMODS[(w*3)%LMODS.length]);nm='Anomaly';ic='🌀';break;
  case 6:goal={t:'defend',n:Math.min(100,45+Math.floor(n*.5))};pool=['drone','swarmer','fighter'];nm='Guard the Core';ic='🏰';break;
  case 7:goal={t:'kills',n:Math.min(150,30+Math.floor(n*1.1))};mods.push(LMODS[(w*3+1)%LMODS.length]);nm='Storm Front';ic='⛈️';break;
  case 8:goal={t:'time',n:Math.min(110,50+Math.floor(n*.5))};mods.push(LMODS[(w*3+2)%LMODS.length]);if(n>40)cfg.lives=1;nm='Final Approach';ic='🚀';break;
  default:goal={t:'boss'};cfg.boss=[[w%BOSSES.length,Math.floor(w/BOSSES.length)]];if(w>=4)cfg.minions=true;nm='WORLD BOSS · '+BOSSES[w%BOSSES.length].n;ic='👾';
   if(n===80){cfg.boss=[[4,2]];cfg.minions=true;cfg.lives=1;nm='FINAL BOSS · OMEGA PRIME';ic='👑';}
 }
 cfg.goal=goal;cfg.mods=mods;if(pool)cfg.pool=pool;cfg.reward=100+n*14;
 return{id:'L'+n,lvl:n,n:'Lv '+n+' · '+nm,ic:ic,cat:'lvl',diff:diff,desc:'World '+(w+1)+' · '+WORLDN[w],cfg:cfg};
}
function chalOf(o){return o.lvl?levelDef(o.lvl):CHALS[o.id-1];}

  var m=hyp(mx,my);P.x+=mx/m*P.spd*dt;P.y+=my/m*P.spd*dt;P.tx=P.x;P.ty=P.y;
 }else{
  var dx=P.tx-P.x,dy=P.ty-P.y,d=hyp(dx,dy),cap=P.spd*1.9*dt,st=Math.min(d,Math.max(d*Math.min(1,dt*16),0));if(st>cap)st=cap;
  if(d>.01){P.x+=dx/d*st;P.y+=dy/d*st;}

 if(G.M.gravity){var gx=W/2-P.x,gy=H*.45-P.y,gd=hyp(gx,gy)+1;P.x+=gx/gd*230*dt;P.y+=gy/gd*230*dt;}

 var td=todayKey(),wk=weekKey();

function pickMissions(seed){
 var r=mulberry(seed*7919+13),a=MPOOL.map(function(m){return m.id;}),i;
 for(i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}
 return a.slice(0,6);
}
function mdef(pool,id){return pool.filter(function(m){return m.id===id;})[0];}
function track(k,n){
 var e=profile.ev;if(!e||!e.st||!e.dm)return;e.st[k]=(e.st[k]||0)+n;
 [[e.dm,MPOOL],[e.wm,WPOOL]].forEach(function(pr){var m=pr[0];if(!m||!m.ids)return;m.ids.forEach(function(id){var d=mdef(pr[1],id);if(d&&d.s===k&&!d.mx)m.p[id]=Math.min(d.n,(m.p[id]||0)+n);});});
}
function trackMax(k,v){
 var e=profile.ev;if(!e||!e.st||!e.dm)return;if(v>(e.st[k]||0))e.st[k]=v;
 if(e.dm.ids)e.dm.ids.forEach(function(id){var d=mdef(MPOOL,id);if(d&&d.s===k&&d.mx)e.dm.p[id]=Math.max(e.dm.p[id]||0,Math.min(d.n,v));});
}
function addXP(n){var p=profile.ev.pass;p.xp=Math.min(3000,p.xp+n);}
function rewardText(r){
 var t=[];if(r.c)t.push('● '+fmt(r.c));if(r.g)t.push('◆ '+r.g);if(r.t)t.push('🎫 '+r.t);if(r.x)t.push('XP '+r.x);
 if(r.plane)t.push('✈ '+PLANES[r.plane].n);if(r.paint)t.push('🎨 '+r.paint.toUpperCase());return t.join(' · ');
}
function giveR(r){
 var t=[];
 if(r.c){profile.coins+=r.c;t.push('● '+fmt(r.c));}
 if(r.g){profile.gems+=r.g;t.push('◆ '+r.g);}
 if(r.t){profile.tokens+=r.t;t.push('🎫 '+r.t);}
 if(r.x){addXP(r.x);t.push('XP '+r.x);}
 if(r.plane){if(profile.planes[r.plane]){profile.coins+=3000;t.push('● 3,000 (जहाज़ पहले से है)');}else{profile.planes[r.plane]=1;t.push('✈ '+PLANES[r.plane].n+' अनलॉक!');}}
 if(r.paint){if(profile.paints[r.paint]){profile.gems+=10;t.push('◆ 10 (पेंट पहले से है)');}else{profile.paints[r.paint]=1;t.push('🎨 '+r.paint.toUpperCase()+' अनलॉक!');}}
 saveP();return t.join('  ');
}

function evAct(a,v){
 var fixed=false;
 switch(a){
  case'story':modalStory();return true;
  case'sw':modalStory(+v);return true;
  case'lvd':modalLvDet(+v);return true;
  case'lvgo':startGame('chal',{lvl:+v});return true;
  case'nextl':if(lastStart&&lastStart.opts.lvl)modalLvDet(lastStart.opts.lvl+1);return true;
  case'journey':modalStory();return true;
  case'ev':modalEvent();return true;
  case'evt':modalEvent(v);return true;
  case'cl':claimLogin();break;
  case'clm':claimLM(+v);break;
  case'cm':claimM(v);break;
  case'cchest':claimChest();break;
  case'cpass':claimPass(v);break;
  case'cpassall':claimPassAll();break;
  case'belite':buyElite();break;
  case'spin':doSpin(true);return true;
  case'spinp':doSpin(false);return true;
  case'shopb':buyShop(v);break;
  case'ach':claimAch(v);break;
  default:return false;
 }
 modalEvent();return true;
}

var ASFB={ready:false,db:null,uid:null,profileRef:null,profile:null,roomRef:null,roomUnsub:null};
function asFBInit(){
 try{
  if(!window.ASTRA_FIREBASE_CONFIG||!window.ASTRA_FIREBASE_CONFIG.apiKey||window.ASTRA_FIREBASE_CONFIG.apiKey==='PASTE_API_KEY_HERE')return false;
  if(!firebase.apps.length)firebase.initializeApp(window.ASTRA_FIREBASE_CONFIG);
  ASFB.db=firebase.database();
  firebase.auth().onAuthStateChanged(function(user){
   if(!user){firebase.auth().signInAnonymously().catch(function(e){console.warn('Firebase sign-in:',e);});return;}
   ASFB.uid=user.uid;ASFB.ready=true;
   var localUid=mpUID(),name=localStorage.getItem('as_piyush_name')||'Piyush';
   ASFB.profile={uid:localUid,authUid:user.uid,name:name,nameLower:name.toLowerCase(),online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP};
   ASFB.profileRef=ASFB.db.ref('players/'+user.uid);
   ASFB.profileRef.update(ASFB.profile).catch(function(e){console.warn(e);});
   ASFB.profileRef.onDisconnect().update({online:false,lastSeen:firebase.database.ServerValue.TIMESTAMP});
  });
  return true;
 }catch(e){console.warn('Firebase init:',e);return false;}
}
function asStatus(){return ASFB.ready?'🟢 ONLINE DATABASE CONNECTED':'🟠 Firebase setup required';}
function asSafe(s){return esc(String(s||''));}
function asSearch(){
 if(!ASFB.ready){alert('पहले Firebase config सेट करें। README_HINDI.txt में आसान स्टेप्स हैं।');return;}
 var q=($('mpSearch')?$('mpSearch').value:'').trim().toLowerCase();if(!q){alert('नाम या Player UID लिखें।');return;}
 ASFB.db.ref('players').once('value').then(function(snap){var out=[];snap.forEach(function(ch){var p=ch.val()||{};if(ch.key!==ASFB.uid&&p.online&&(String(p.nameLower||'').indexOf(q)>=0||String(p.uid||'').toLowerCase()===q))out.push({key:ch.key,p:p});});
  var box=$('mpSearchResults');if(!box)return;box.innerHTML=out.length?out.map(function(x){return '<div class="mp-friend"><div><b>'+asSafe(x.p.name)+'</b><small>UID: '+asSafe(x.p.uid)+'</small></div><button class="btn go sm" data-act="mprequest" data-v="'+asSafe(x.key)+'">＋ Request</button></div>';}).join(''):'<p class="mp-note">कोई ऑनलाइन खिलाड़ी नहीं मिला। UID पूरा लिखकर खोजें।</p>';
 }).catch(function(e){alert('Search error: '+e.message);});
}
function asSendRequest(targetKey){if(!ASFB.ready){alert('Firebase setup आवश्यक है।');return;}if(targetKey===ASFB.uid)return;var req={from:ASFB.uid,fromUid:mpUID(),fromName:(ASFB.profile&&ASFB.profile.name)||'Player',status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP};ASFB.db.ref('friendRequests/'+targetKey+'/'+ASFB.uid).set(req).then(function(){alert('Friend request भेज दी गई!');}).catch(function(e){alert('Request error: '+e.message);});}
function asLoadRequests(){if(!ASFB.ready)return;ASFB.db.ref('friendRequests/'+ASFB.uid).once('value').then(function(s){var box=$('mpRequests');if(!box)return;var arr=[];s.forEach(function(ch){var r=ch.val()||{};if(r.status==='pending')arr.push({key:ch.key,r:r});});box.innerHTML=arr.length?arr.map(function(x){return '<div class="mp-friend"><div><b>'+asSafe(x.r.fromName||'Player')+'</b><small>UID: '+asSafe(x.r.fromUid||'')+'</small></div><button class="btn go sm" data-act="mpaccept" data-v="'+asSafe(x.key)+'">Accept</button></div>';}).join(''):'<p class="mp-note">कोई नई friend request नहीं।</p>';}).catch(function(e){console.warn(e);});}
function asAcceptRequest(fromKey){if(!ASFB.ready)return;var updates={};updates['friends/'+ASFB.uid+'/'+fromKey]={since:firebase.database.ServerValue.TIMESTAMP};updates['friends/'+fromKey+'/'+ASFB.uid]={since:firebase.database.ServerValue.TIMESTAMP};updates['friendRequests/'+ASFB.uid+'/'+fromKey]=null;ASFB.db.ref().update(updates).then(function(){multiplayerScreen('Friend added');}).catch(function(e){alert('Accept error: '+e.message);});}
function asLoadFriends(){if(!ASFB.ready)return Promise.resolve([]);return ASFB.db.ref('friends/'+ASFB.uid).once('value').then(function(s){var keys=[];s.forEach(function(c){keys.push(c.key);});return Promise.all(keys.map(function(k){return ASFB.db.ref('players/'+k).once('value').then(function(p){return {key:k,p:p.val()||{name:'Player',uid:'Unknown'}};});}));});}
function asCreateRoom(){if(!ASFB.ready){alert('पहले Firebase config सेट करें।');return;}var code=Math.random().toString(36).slice(2,8).toUpperCase();var room={code:code,host:ASFB.uid,hostUid:mpUID(),status:'waiting',maxPlayers:4,createdAt:firebase.database.ServerValue.TIMESTAMP,members:{}};room.members[ASFB.uid]={uid:mpUID(),name:(ASFB.profile&&ASFB.profile.name)||'Piyush',ready:false,joinedAt:firebase.database.ServerValue.TIMESTAMP};ASFB.db.ref('rooms/'+code).set(room).then(function(){ASFB.roomRef=ASFB.db.ref('rooms/'+code);multiplayerScreen('ROOM:'+code);}).catch(function(e){alert('Room create error: '+e.message);});}
function asJoinRoom(){if(!ASFB.ready){alert('पहले Firebase config सेट करें।');return;}var code=( $('mpRoomCode')?$('mpRoomCode').value:'' ).trim().toUpperCase();if(!code){alert('Room code डालें।');return;}var ref=ASFB.db.ref('rooms/'+code);ref.transaction(function(r){if(!r||r.status!=='waiting')return; r.members=r.members||{};if(Object.keys(r.members).length>=4)return; r.members[ASFB.uid]={uid:mpUID(),name:(ASFB.profile&&ASFB.profile.name)||'Player',ready:false,joinedAt:firebase.database.ServerValue.TIMESTAMP};return r;},function(err,committed,snap){if(err||!committed){alert('Room नहीं मिला या भर चुका है।');return;}ASFB.roomRef=ref;multiplayerScreen('ROOM:'+code);});}
function asRenderRoom(code){if(!ASFB.ready)return;ASFB.db.ref('rooms/'+code).on('value',function(s){var r=s.val(),box=$('mpRoomInfo');if(!box)return;if(!r){box.innerHTML='<p>Room बंद हो गया।</p>';return;}var members=Object.keys(r.members||{}).map(function(k){var m=r.members[k];return '<div class="mp-friend"><div><b>'+asSafe(m.name)+'</b><small>'+asSafe(m.uid)+'</small></div><span class="mp-badge">'+(m.ready?'READY':'WAITING')+'</span></div>';}).join('');box.innerHTML='<h3>ROOM '+asSafe(r.code)+'</h3><p>Players: '+Object.keys(r.members||{}).length+'/4</p>'+members+'<p class="mp-note">Lobby real-time है। गेम के दोनों/चार खिलाड़ियों को एक ही लड़ाई में चलाने के लिए game-engine synchronization अगला चरण है; अभी यह lobby अपने-आप gameplay को sync नहीं करती।</p><div class="row"><button class="btn go" data-act="mpready" data-v="'+asSafe(r.code)+'">I am Ready</button><button class="btn alt" data-act="mpleave" data-v="'+asSafe(r.code)+'">Leave Room</button></div>';}).catch(function(e){console.warn(e);});}
function asReadyRoom(code){if(!ASFB.ready)return;ASFB.db.ref('rooms/'+code+'/members/'+ASFB.uid+'/ready').set(true).then(function(){asRenderRoom(code);});}
function asLeaveRoom(code){if(!ASFB.ready)return;var ref=ASFB.db.ref('rooms/'+code);ref.child('members/'+ASFB.uid).remove().then(function(){ref.once('value').then(function(s){var r=s.val();if(!r||!r.members||!Object.keys(r.members).length)ref.remove();});ASFB.roomRef=null;multiplayerScreen();});}

function goalDesc(c){
 var g=c.goal,n=g.n,s='';
 switch(g.t){
  case'time':s=n+' सेकंड तक टिके रहो';break;
  case'defend':s=n+' सेकंड तक अपने कोर को बचाओ';break;
  case'kills':s=n+' दुश्मन गिराओ';break;
  case'elites':s=n+' एलीट दुश्मन गिराओ';break;
  case'typekills':s=n+' '+g.type.toUpperCase()+' गिराओ';break;
  case'score':s=n+' स्कोर बनाओ';break;
  case'coins':s=n+' सिक्के इकट्ठा करो';break;
  case'combo':s=n+' का कॉम्बो बनाओ';break;

 h+='</div><div class="box"><div class="wd" style="display:flex;gap:14px;flex-wrap:wrap"><canvas id="pv" width="380" height="380" style="width:190px;height:190px;border-radius:16px;background:radial-gradient(circle,#2e2a8a,#0a0c30);border:1px solid #303a86"></canvas><div style="flex:1;min-width:210px"><div class="pn">'+d.n+'</div><div class="role">'+d.role+'</div>'+sb('SPEED',d.spd*7.8)+sb('ARMOR',d.hp/17)+sb('FIREPOWER',d.fp)+sb('FIRE RATE',d.sp)+'<div class="abl"><b>SKILL · '+d.abn+'  ('+d.abCd+'s)</b>'+d.abd+'</div></div></div><div class="lbl">पेंट</div><div class="row">'+paintList().map(function(c,i){return'<div class="sw'+((profile.paint[id]||null)===c?' on':'')+'" style="background:'+(c==='prism'?'linear-gradient(135deg,#f55,#fd5,#5f8,#5df,#a5f)':c?'rgb('+c+')':'linear-gradient(135deg,rgb('+d.col+'),#fff)')+'" data-act="paint" data-v="'+i+'"></div>';}).join('')+'</div><div class="row">'+
 (own?(id===profile.sel?'<button class="btn" disabled>✔ SELECTED</button>':'<button class="btn go" data-act="selp" data-v="'+id+'">इसे चुनो</button>')+' <button class="btn alt" data-act="upg">⚡ Upgrades</button>':'<button class="btn" data-act="buyp" data-v="'+id+'"'+(profile.coins<d.cost?' disabled':'')+'>अनलॉक · ● '+fmt(d.cost)+'</button>')+'</div></div>';
 screen(h);
 var cs=ui.querySelectorAll('canvas[data-pid]');for(var i=0;i<cs.length;i++){var c=cs[i];drawPv(c,c.dataset.pid,.95,0);}
 stopPv();pvT=setInterval(function(){pvTick+=.04;var c=$('pv');if(c)drawPv(c,id,1.9,pvTick);},40);
}

 var id=profile.sel,d=PLANES[id],u=upOf(id);
 var h='<div class="bar"><button class="ico" data-act="menu">←</button><span class="coin">● '+fmt(profile.coins)+'</span></div><div class="box"><h2>UPGRADES · '+d.n+'</h2><p>ये अपग्रेड हर मैच में काम करते हैं और सेव रहते हैं।</p>';
 UPS.forEach(function(up){var lv=u[up.k],mx=lv>=up.max,cost=up.cost(lv),pips='';for(var i=0;i<up.max;i++)pips+='<i class="'+(i<lv?'on':'')+'"></i>';
  h+='<div class="upg"><div class="t"><b>'+up.n+' <span style="color:#4be3ff">Lv '+lv+'/'+up.max+'</span></b><small>'+up.d+'</small><div class="pips">'+pips+'</div></div>'+(mx?'<button class="btn sm" disabled>MAX</button>':'<button class="btn sm" data-act="up" data-v="'+up.k+'"'+(profile.coins<cost?' disabled':'')+'>● '+fmt(cost)+'</button>')+'</div>';});
 screen(h+'<div class="row"><button class="btn alt" data-act="hangar">✈ जहाज़ बदलो</button></div></div>');

 screen('<div class="box" style="margin-top:6vh"><h2>SETTINGS</h2><div class="lbl">ग्राफिक्स क्वालिटी (रेज़ोल्यूशन)</div><div class="row">'+RESO.map(function(r){return seg('res',r[0],r[1],settings.q===r[0]);}).join('')+'</div><p>कम पर तेज़ चलेगा; हाई रेज़ोल्यूशन पर ग्राफिक्स शार्प होंगे और फ़ोन पर लोड बढ़ सकता है।</p><div class="lbl">इफ़ेक्ट्स</div><div class="row">'+seg('fx','low','Low',settings.fx==='low')+seg('fx','high','High',settings.fx==='high')+'</div><div class="lbl">बाकी</div><div class="row">'+seg('tg','sound','Sound: '+(settings.sound?'ON':'OFF'),settings.sound)+seg('tg','vib','Vibration: '+(settings.vib?'ON':'OFF'),settings.vib)+seg('tg','fps','FPS: '+(settings.fps?'ON':'OFF'),settings.fps)+'</div><div class="row"><button class="btn" data-act="'+(G?'resumeset':'menu')+'">ठीक है</button></div></div>',!!G);
}
function stars3(n){return'★'.repeat(n)+'☆'.repeat(3-n);}
function showResult(r){
 $('pauseBtn').classList.add('hide');
 var nm=r.mode==='camp'?'SECTOR '+G.opts.sector:(r.name||MODEN[r.mode]);
 screen('<div class="box" style="margin-top:5vh"><div class="big" style="color:'+(r.win?'#3ddc84':'#ff6a7a')+'">'+(r.win?'MISSION COMPLETE':'SHIP DESTROYED')+'</div><p>'+nm+((r.mode==='camp'||r.mode==='chal')&&r.win?'  ·  <span style="color:#ffd34d;letter-spacing:3px;font-size:20px">'+stars3(r.stars)+'</span>':'')+(r.newBest?'  ·  <b style="color:#ffd34d">NEW BEST!</b>':'')+'</p>'+r.rows.map(function(x){return'<div class="rs"><span>'+x[0]+'</span><b>'+fmt(x[1])+'</b></div>';}).join('')+'<div class="rs"><span>कुल कमाई</span><b style="color:#ffd34d">● '+fmt(r.total)+'</b></div><div class="rs"><span>Best score</span><b>'+fmt(r.best||0)+'</b></div><div class="row" style="margin-top:12px"><button class="btn" data-act="again">फिर से खेलो</button>'+(r.mode==='camp'&&r.win&&G.opts.sector<8?'<button class="btn go" data-act="next">अगला सेक्टर →</button>':'')+(r.mode==='chal'&&r.win&&!G.opts.lvl&&G.opts.id<50?'<button class="btn go" data-act="nextc">अगला चैलेंज →</button>':'')+(r.mode==='chal'&&r.win&&G.opts.lvl&&G.opts.lvl<80?'<button class="btn go" data-act="nextl">अगला लेवल →</button>':'')+(r.mode==='chal'?'<button class="btn alt" data-act="'+(G.opts.lvl?'journey':'chals')+'">'+(G.opts.lvl?'सारे लेवल':'सारे चैलेंज')+'</button>':'')+'<button class="btn alt" data-act="upg">⚡ Upgrades</button><button class="btn alt" data-act="menu">मेन्यू</button></div></div>',true);
 G.paused=true;
}
function togglePause(){
 if(!G||G.over)return;
 if(G.paused){G.paused=false;hideScreen();return;}
 G.paused=true;screen('<div class="box" style="margin-top:14vh"><h2>PAUSED</h2><div class="row"><button class="btn" data-act="resume">जारी रखो</button><button class="btn alt" data-act="settings">Settings</button><button class="btn alt" data-act="quit">मिशन छोड़ो</button></div></div>',true);
}
asFBInit();
stage.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;audioInit();var a=t.dataset.act,v=t.dataset.v;sfx('click',.5);if(evAct(a,v))return;
 switch(a){
  case'menu':showMenu();break;
  case'multiplayer':multiplayerScreen();break;
  case'mpsavename':{var pn=$('mpPlayerName')?$('mpPlayerName').value.trim():'Piyush';if(!pn){alert('नाम लिखें।');break;}localStorage.setItem('as_piyush_name',pn);if(ASFB.ready)ASFB.db.ref('players/'+ASFB.uid).update({name:pn,nameLower:pn.toLowerCase(),uid:mpUID(),online:true,lastSeen:firebase.database.ServerValue.TIMESTAMP});alert('गेम नेम सेव हो गया।');multiplayerScreen();break;}
  case'mpsearch':asSearch();break;
  case'mprequest':asSendRequest(v);break;
  case'mpaccept':asAcceptRequest(v);break;
  case'mprefresh':asLoadRequests();break;
  case'mpcreate':asCreateRoom();break;
  case'mpjoin':asJoinRoom();break;
  case'mpready':asReadyRoom(v);break;
  case'mpleave':asLeaveRoom(v);break;
  case'mpremove':{var fs2=mpFriends();fs2.splice(+v,1);saveMPFriends(fs2);multiplayerScreen();break;}
  case'mpcopy':{var uid2=mpUID();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(uid2).then(function(){alert('UID कॉपी हो गई: '+uid2);}).catch(function(){prompt('अपनी UID कॉपी करें:',uid2);});}else{prompt('अपनी UID कॉपी करें:',uid2);}break;}
  case'hangar':profile.hv=profile.sel;modalHangar();break;
  case'hv':profile.hv=v;modalHangar();break;
  case'selp':profile.sel=v;profile.hv=v;saveP();modalHangar();break;
  case'buyp':{var d=PLANES[v];if(profile.coins>=d.cost){profile.coins-=d.cost;profile.planes[v]=1;profile.sel=v;profile.hv=v;saveP();}modalHangar();break;}
  case'paint':{var id=profile.hv||profile.sel;profile.paint[id]=paintList()[+v];saveP();modalHangar();break;}
  case'upg':modalUpg();break;
  case'up':{var u=upOf(profile.sel),def=UPS.filter(function(x){return x.k===v;})[0],c=def.cost(u[v]);if(u[v]<def.max&&profile.coins>=c){profile.coins-=c;u[v]++;saveP();}modalUpg();break;}
  case'camp':modalCamp();break;
  case'sector':startGame('camp',{sector:+v});break;
  case'endless':startGame('endless',{});break;
  case'rush':startGame('rush',{});break;
  case'blitz':startGame('blitz',{});break;
  case'again':if(lastStart)startGame(lastStart.mode,lastStart.opts);break;
  case'next':if(lastStart)startGame('camp',{sector:lastStart.opts.sector+1});break;
  case'chals':modalChals();break;
  case'chcat':modalChals(v);break;
  case'chd':modalChDet(+v);break;
  case'chgo':startGame('chal',{id:+v});break;
  case'daily':modalChDet(dailyId());break;
  case'nextc':if(lastStart)modalChDet(lastStart.opts.id+1);break;
  case'settings':modalSettings();break;
  case'res':settings.q=+v;saveS();applyRes();modalSettings();break;
  case'fx':settings.fx=v;saveS();modalSettings();break;
  case'tg':settings[v]=!settings[v];saveS();modalSettings();break;
  case'resumeset':togglePause();G.paused=true;togglePause();break;
  case'pause':togglePause();break;
  case'resume':togglePause();break;
  case'quit':if(G)G.over=true;showMenu();break;
 }
});

// ---------- input ----------
function toL(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function hitBtn(p){for(var i=I.btns.length-1;i>=0;i--){var b=I.btns[i];if(hyp(p.x-b.x,p.y-b.y)<=b.r*1.12)return b;}return null;}
function setTarget(p,e){if(!P)return;P.tx=clamp(p.x,30,W-30);P.ty=clamp(p.y-(e.pointerType==='mouse'?0:170),H*.22,H-110);}
cv.addEventListener('pointerdown',function(e){
 e.preventDefault();audioInit();if(!G||G.paused)return;
 var p=toL(e);I.touch=e.pointerType!=='mouse';var b=hitBtn(p);
 if(b){I.press[b.id]=true;return;}
 try{cv.setPointerCapture(e.pointerId);}catch(x){}
 I.ptr=e.pointerId;setTarget(p,e);
});
cv.addEventListener('pointermove',function(e){
 if(!G||G.paused)return;
 if(e.pointerType==='mouse'){I.mouseOn=true;I.touch=false;setTarget(toL(e),e);return;}
 if(e.pointerId===I.ptr)setTarget(toL(e),e);
});
function endPtr(e){if(e.pointerId===I.ptr)I.ptr=null;}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);cv.addEventListener('contextmenu',function(e){e.preventDefault();I.press.abil=true;});
window.addEventListener('keydown',function(e){
 var k=e.key.toLowerCase();I.keys[k]=true;if(!G)return;
 if(k===' '||k.indexOf('arrow')===0||k==='tab')e.preventDefault();
 if(e.repeat)return;
 if(k===' ')I.press.abil=true;else if(k==='e'||k==='shift')I.press.ult=true;else if(k==='p'||k==='escape')togglePause();
});
window.addEventListener('keyup',function(e){I.keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',function(){I.keys={};});
document.addEventListener('visibilitychange',function(){if(document.hidden&&G&&!G.paused&&!G.over)togglePause();});
window.addEventListener('resize',function(){applyRes();});

// ---------- loop ----------
var last=0;
function frame(ts){
 requestAnimationFrame(frame);
 var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;sndN=0;
 if(G){G.fps+=(1/Math.max(dt,.001)-G.fps)*.05;update(dt);}
 else{for(var i=0;i<STARS.length;i++){var s=STARS[i];s.y+=s.v*dt*.6;if(s.y>H+20){s.y=-20;s.x=rnd(0,W);}}}
 render();
}
ensureEv();applyRes();showMenu();requestAnimationFrame(frame);
window.__AS={evAct:evAct,levelDef:levelDef,modalEvent:modalEvent,modalStory:modalStory,paintList:paintList,track:track,ensureEv:ensureEv,evBadge:evBadge,startGame:startGame,update:update,render:render,G:function(){return G;},P:function(){return P;},I:I,profile:profile,showMenu:showMenu,useAbility:useAbility,useUlt:useUlt};
})();
</script>
